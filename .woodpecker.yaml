# Trusted Woodpecker pipeline template (digest-pinned 2026-09-02).
#
# Enable only on repositories a trusted org member administers. Community
# forks are not Woodpecker projects. Fork PRs require maintainer approval
# (`WOODPECKER_DEFAULT_APPROVAL_MODE=forks`). Deploy secrets must be stored
# with events: [push, manual] only — never pull_request.
#
# Copy to `.woodpecker.yaml` and add product test/build steps from that repo.
# Do not float tags. Bump a digest the same way as deploy/compose.yaml.

when:
  - event: [push, manual]
    branch: main
  - event: pull_request

steps:
  - name: gitleaks
    image: zricethezav/gitleaks:v8.30.0@sha256:691af3c7c5a48b16f187ce3446d5f194838f91238f27270ed36eef6359a574d9
    entrypoint: ["/bin/sh", "-c"]
    commands:
      - |
        if [ -f .gitleaks.toml ]; then
          gitleaks detect --source . --config .gitleaks.toml --verbose --redact --exit-code 1
        else
          gitleaks detect --source . --verbose --redact --exit-code 1
        fi

  - name: opengrep
    image: alpine:3.22@sha256:14358309a308569c32bdc37e2e0e9694be33a9d99e68afb0f5ff33cc1f695dce
    commands:
      - |
        set -euo pipefail
        apk add --no-cache curl
        curl -fsSL -o /tmp/opengrep \
          https://github.com/opengrep/opengrep/releases/download/v1.29.0/opengrep_musllinux_x86
        echo "1b474bf207905a3cffe4e915fe36895835bc89de2620cb2ffd88ca512d9ea31b  /tmp/opengrep" | sha256sum -c
        chmod +x /tmp/opengrep
        if [ -f .opengrep.yml ]; then
          /tmp/opengrep scan --error --metrics=off --config .opengrep.yml .
        elif [ -f .opengrep.yaml ]; then
          /tmp/opengrep scan --error --metrics=off --config .opengrep.yaml .
        else
          echo "missing .opengrep.yml" >&2
          exit 1
        fi

  - name: trivy-fs
    image: woodpeckerci/plugin-trivy:1.2.0@sha256:8019658e562d06876fd8b3ac9640c20e0fd964e5fbac3a41856443f0d9d672ba
    settings:
      dir: .
      severity: HIGH,CRITICAL
      exit-code: 1
      skip-dirs: vendor,node_modules

  - name: coolify-deploy
    image: curlimages/curl:8.16.0@sha256:463eaf6072688fe96ac64fa623fe73e1dbe25d8ad6c34404a669ad3ce1f104b6
    environment:
      COOLIFY_TOKEN:
        from_secret: coolify_token
      COOLIFY_APP_UUID:
        from_secret: coolify_app_uuid
    when:
      - event: push
        branch: main
        status: [success]
    commands:
      - |
        set -euo pipefail
        if [ -z "$COOLIFY_APP_UUID" ]; then
          echo "COOLIFY_APP_UUID unset; skip deploy (lab)"
          exit 0
        fi
        if [ -z "$COOLIFY_TOKEN" ]; then
          echo "COOLIFY_TOKEN missing on a main push; refusing"
          exit 1
        fi
        curl -fsS -X POST \
          -H "Authorization: Bearer $COOLIFY_TOKEN" \
          -H "Content-Type: application/json" \
          "http://10.10.0.2:8000/api/v1/deploy?uuid=$COOLIFY_APP_UUID&force=true"

  - name: telegram-failure
    image: appleboy/drone-telegram:1.3.0@sha256:a5198f0a17cfdef85a2b8f19d379bcbfd482db911a5c02fbc311a0067d82b3f0
    when:
      - status: [failure]
    settings:
      token:
        from_secret: telegram_bot_token
      to:
        from_secret: telegram_chat_id
      message: >-
        {{repo.owner}}/{{repo.name}} #{{build.number}} failed on {{build.branch}}
        ({{build.event}}).
